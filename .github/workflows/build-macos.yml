name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # per pubblicare le release quando si crea un tag v*

jobs:
  macos:
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configura (universal binary arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test del motore
        run: |
          ./build/Release/os_test
          ./build/Release/lp_test
          ./build/Release/engine_test

      - name: Validazione Audio Unit (auval)
        continue-on-error: true
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumf Str2 Clfx

      - name: Firma ad-hoc e pacchetto
        run: |
          A=build/Satura_artefacts/Release
          mkdir -p "dist/SATURA"
          cp -R "$A/VST3/SATURA.vst3" "$A/AU/SATURA.component" "$A/Standalone/SATURA.app" "dist/SATURA/"
          for p in "dist/SATURA/"*; do codesign --force --deep --sign - "$p"; done
          cp scripts/installa.command "dist/SATURA/Installa SATURA.command"
          chmod +x "dist/SATURA/Installa SATURA.command"
          cp README.md "dist/SATURA/"
          lipo -info "dist/SATURA/SATURA.vst3/Contents/MacOS/SATURA"
          (cd dist && ditto -c -k --keepParent "SATURA" ../SATURA-macOS.zip)

      - name: Carica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: SATURA-macOS
          path: SATURA-macOS.zip

      - name: Pubblica la release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" SATURA-macOS.zip \
            --title "SATURA ${GITHUB_REF_NAME}" \
            --notes "Build macOS universale (Apple Silicon e Intel) con VST3, AU e Standalone."
